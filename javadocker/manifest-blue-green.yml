apiVersion: v1
kind: Namespace
metadata:
  name: amitpradhan

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-web-deployment-blue
  namespace: amitpradhan
  labels:
    app: java-web
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-web
      version: blue
  template:
    metadata:
      labels:
        app: java-web
        version: blue
    spec:
      containers:
      - name: java-web
        image: amitpradhan1999/assignment1-backend:latest
        ports:
        - containerPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-web-deployment-green
  namespace: amitpradhan
  labels:
    app: java-web
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-web
      version: green
  template:
    metadata:
      labels:
        app: java-web
        version: green
    spec:
      containers:
      - name: java-web
        image: amitpradhan1999/assignment1-frontend:latest
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: java-web-service
  namespace: amitpradhan
spec:
  type: LoadBalancer
  selector:
    app: java-web
    version: blue
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: java-web-service-green
  namespace: amitpradhan
spec:
  type: ClusterIP
  selector:
    app: java-web
    version: green
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000